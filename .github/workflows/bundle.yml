name: Build bundle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
  # No push trigger: this workflow only exists on main, so pushes to the
  # backend, frontend, and cli branches cannot trigger it from those branches.

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: true
          fetch-depth: 0

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Build and publish bundle
        run: node scripts/build-bundle.mjs --push